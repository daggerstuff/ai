[pytest]
pythonpath = . .. scripts
filterwarnings =
    # SWIG-compiled C extensions (sentence_transformers transitive deps) emit
    # DeprecationWarning from <frozen importlib._bootstrap> at import time on
    # Python 3.13+.  The warning has no runtime impact; silence it by matching
    # the exact message text so it does not pollute test output.
    ignore:builtin type SwigPyPacked has no __module__ attribute
    ignore:builtin type SwigPyObject has no __module__ attribute
    ignore:builtin type swigvarlink has no __module__ attribute
    # PyTorch 2.x emits this from its own torch/jit/_script.py:365 — third-party,
    # not actionable from our code. Remove when PyTorch drops script_method.
    ignore::DeprecationWarning:torch.jit._script
asyncio_mode = auto
addopts =
    --ignore=inference/deployment/distributed/test_health_and_recovery.py
    --ignore=training/tests/test_nightmare_fuel.py
    --ignore=qa/testing/test_defense_endpoint.py
    --ignore=qa/testing/test_quality_validation_analyzer_backlog_conversion.py
    --ignore=qa/testing/test_end_to_end_pipeline.py
    --ignore=qa/testing/test_integration_validation.py
    --ignore=qa/testing/test_production_validation.py
    --ignore=qa/testing/test_comprehensive_validation.py
    --ignore=qa/testing/integration/test_full_system_validation.py
    --ignore=qa/testing/test_defense_mechanisms.py
    --ignore=qa/testing/test_fixes.py
    --ignore=research/experiments/tests/api/test_api_comprehensive.py
    --ignore=research/experiments/tests/dataset_pipeline
    --ignore=research/experiments/tests/integration/test_full_system_validation.py
    --ignore=research/experiments/tests/pipelines/test_unsloth_finetune.py
    --ignore=research/experiments/tests/test_analytics_dashboard.py
    --ignore=research/experiments/tests/test_clinical_accuracy_validator.py
    --ignore=research/experiments/tests/test_comprehensive_validation.py
    --ignore=research/experiments/tests/test_defense_mechanisms.py
    --ignore=research/experiments/tests/test_end_to_end_pipeline.py
    --ignore=research/experiments/tests/test_integration_validation.py
