[pytest]
pythonpath = . .. scripts
filterwarnings =
    # SWIG-compiled C extensions (sentence_transformers transitive deps) emit
    # DeprecationWarning from <frozen importlib._bootstrap> at import time on
    # Python 3.13+.  The warning has no runtime impact; silence it by matching
    # the exact message text so it does not pollute test output.
    ignore:builtin type SwigPyPacked has no __module__ attribute
    ignore:builtin type SwigPyObject has no __module__ attribute
    ignore:builtin type swigvarlink has no __module__ attribute
    # PyTorch 2.x emits this from its own torch/jit/_script.py:365 — third-party,
    # not actionable from our code. Remove when PyTorch drops script_method.
    ignore::DeprecationWarning:torch.jit._script
