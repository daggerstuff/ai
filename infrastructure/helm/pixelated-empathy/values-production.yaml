# Production environment values sized for the current live AKS cluster.
environment: "production"

replicaCount: 2

app:
  config:
    logLevel: "INFO"
    debug: false
    maxWorkers: 2
    batchSize: 50

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 512Mi

autoscaling:
  enabled: false

postgresql:
  primary:
    persistence:
      enabled: true
      size: 20Gi
      storageClass: "default"
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 512Mi

redis:
  master:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: "default"
    resources:
      limits:
        cpu: 250m
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 256Mi
  replica:
    replicaCount: 1
    persistence:
      enabled: true
      size: 8Gi
      storageClass: "default"
    resources:
      limits:
        cpu: 250m
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 256Mi

monitoring:
  prometheus:
    enabled: false
  grafana:
    enabled: false

ingress:
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    kubernetes.io/ingress.class: "caddy"
    caddy.ingress.kubernetes.io/disable-http-redirect: "true"
  hosts:
    - host: pixelatedempathy.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: pixelated-empathy-production-tls
      hosts:
        - pixelatedempathy.com

backup:
  enabled: false
