# Staging environment values
environment: 'staging'

replicaCount: 1

image:
  tag: 'staging-latest'

app:
  config:
    logLevel: 'INFO'
    debug: false
    maxWorkers: 2
    batchSize: 50

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 512Mi

autoscaling:
  enabled: false

postgresql:
  primary:
    persistence:
      size: 8Gi
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 512Mi

redis:
  master:
    persistence:
      size: 2Gi
    resources:
      limits:
        cpu: 250m
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 256Mi

ingress:
  hosts:
    - host: staging-api.pixelated-empathy.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: pixelated-empathy-staging-tls
      hosts:
        - staging-api.pixelated-empathy.ai

backup:
  enabled: false
