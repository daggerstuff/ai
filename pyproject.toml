[project]
name = "pixelated-ai"
version = "0.0.1"
description = "Pixelated Empathy AI - Production Quality Monitoring System"
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=4.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "plotly>=5.15.0",
    "jinja2>=3.1.6",
    "python-dateutil>=2.8.0",
    "transformers>=5.14.1",
    "datasets>=2.19.0",
    "accelerate>=0.33.0",
    "peft>=0.11.0",
    "trl>=0.11.0",
    "sentencepiece>=0.2.0",
    "einops>=0.7.0",
    "pydantic>=2.11.7",
    "starlette>=1.3.1",
    "pydub>=0.25.1",
    "python-magic>=0.4.27",
    "redis>=6.4.0",
    "requests>=2.33.0",
    "ruff>=0.12.11",
    "black>=26.3.1",
    "nbqa>=1.7.0",
    "torchvision>=0.23.0",
    "torchaudio>=2.8.0",
    "packaging>=25.0",
    "setuptools>=80.9.0",
    "wheel>=0.45.1",
    "huggingface-hub>=1.3.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "cryptography>=50.0.0",
    "pyjwt>=2.13.0",
    "psutil>=5.9.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "httpx>=0.28.1",
    "websockets>=11.0",
    "aiofiles>=23.0.0",
    "openai>=2.6.0",
    "fastapi>=0.124.4",
    "uvicorn[standard]>=0.34.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "mem0ai>=1.0.3",
    "google-genai>=1.62.0",
    "qdrant-client>=1.16.2",
    "mcp>=1.26.0",
    "fastmcp>=3.2.0",
    "e2b>=1.4.0",
    "yt-dlp>=2026.2.21",
    "flask>=3.1.3",
    "flask-cors>=6.0.2",
    "flask-jwt-extended>=4.6.0",
    "flask-socketio>=5.3.6",
    "eventlet>=0.36.0",
    "boto3>=1.42.53",
    "ray>=2.55.0",
    "kernels>=0.12.0,<0.13",
    "sentry-sdk>=2.54.0",
    "pymongo>=4.10.1",
    "motor>=3.6.0",
    "virtualenv>=21.2.0",
    "aiosqlite>=0.22.1",
    "pytest-asyncio>=1.3.0",
    "bedrock-agentcore-starter-toolkit>=0.3.6",
    "tinker>=0.18.2",
    "beautifulsoup4>=4.12.0",
    "ebooklib>=0.18",
    "pypdf>=6.15.0",
    "selectolax>=0.3.21,<1.0",
    "trafilatura>=1.12.0,<2.0",
    "python-docx>=1.1.0,<2.0",
    "bitsandbytes>=0.49.2",
    "celery>=5.6.3",
    "anthropic>=0.107.1",
    "kaggle>=2.2.2",
    "pymupdf>=1.27.2.3",
    "psycopg2-binary>=2.9.12",
    "modal>=1.5.2",
    "fasttext-langdetect>=1.0.2",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "detoxify>=0.5.2",
    "datasketch>=1.6.0",
]

[project.optional-dependencies]
ebook = [
    "mobi>=0.1,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "onnxruntime-gpu>=1.18.0",
    "pip-audit>=2.10.0",
    "hypothesis>=6.155.2",
]

[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "*",
]

[tool.uv]
index-strategy = "first-index"
constraint-dependencies = [
    "gitpython>=3.1.55",
    "aiohttp>=3.13.5",
    "filelock>=3.20.3",
    "pillow>=12.1.1",
    "authlib>=1.6.11",
    "python-multipart>=0.0.30",
    "pytest>=9.0.3",
    "tornado>=6.5.5",
    "dynaconf>=3.2.13",
    "nbconvert>=7.17.0",
    "pyasn1>=0.6.3",
    "urllib3>=2.6.3",
    "werkzeug>=3.1.6",
    "trl>=0.11.0",
    "cbor2>=5.8.1",
    "langchain-core>=1.2.22",
    "diskcache>=6.0.0",
]
index = [
    { name = "pytorch-cpu", url = "https://download.pytorch.org/whl/cpu", explicit = true },
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]
torchaudio = [
    { index = "pytorch-cpu" },
]

[tool.uv.workspace]
members = [
    "training/dataflow_eval",
]

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [
    "node_modules",
    "stubs",
    "venv",
    ".venv",
    "env",
    "build",
    "dist",
    ".coveragerc",
    ".git",
    "dist",
    "**/__pycache__",
    "**/.*",
    "*.ipynb",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "DTZ",
    "PIE",
    "PT",
    "Q",
    "RET",
    "SIM",
    "T20",
    "TID",
    "ARG",
    "PL",
    "RUF",
]
ignore = []

