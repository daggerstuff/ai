# Managed with uv only. Do not use raw python, pip, or poetry in this repo.
[project]
name = "pixelated-ai"
version = "0.0.1"
description = "Pixelated Empathy AI - Production Quality Monitoring System"
requires-python = ">=3.13"
dependencies = [
  "bcrypt>=4.0.0",
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "scikit-learn>=1.3.0",
  "plotly>=5.15.0",
  "jinja2>=3.1.6",
  "python-dateutil>=2.8.0",
  "transformers>=5.14.1",
  "datasets>=2.19.0",
  "accelerate>=0.33.0",
  "peft>=0.11.0",
  "trl>=0.11.0",
  "sentencepiece>=0.2.0",
  "einops>=0.7.0",
  "pydantic>=2.11.7",
  "starlette>=1.3.1",
  "pydub>=0.25.1",
  "python-magic>=0.4.27",
  "redis>=6.4.0",
  "requests>=2.33.0",
  "ruff>=0.12.11",
  "black>=26.3.1",
  "nbqa>=1.7.0",
  "torchvision>=0.23.0",
  "torchaudio>=2.8.0",
  "packaging>=25.0",
  "setuptools>=80.9.0",
  "wheel>=0.45.1",
  "huggingface-hub>=1.3.0",
  # CLI dependencies
  "click>=8.1.0",
  "pyyaml>=6.0",
  "cryptography>=50.0.0",
  "pyjwt>=2.13.0",
  "psutil>=5.9.0",
  "rich>=13.0.0",
  "typer>=0.9.0",
  "httpx>=0.28.1",
  "websockets>=11.0",
  "aiofiles>=23.0.0",
  "openai>=2.6.0",
  # Embedding Agent API dependencies
  "fastapi>=0.124.4",
  "uvicorn[standard]>=0.34.0",
  "sentence-transformers>=3.0.0",
  "faiss-cpu>=1.8.0",
  # Memory & User Management
  "mem0ai>=1.0.3",
  "google-genai>=1.62.0",
  "qdrant-client>=1.16.2",
  "mcp>=1.26.0",
  "fastmcp>=3.2.0",
  "e2b>=1.4.0",
  "yt-dlp>=2026.2.21",
  "flask>=3.1.3",
  "flask-cors>=6.0.2",
  "flask-jwt-extended>=4.6.0",
  "flask-socketio>=5.3.6",
  "eventlet>=0.36.0",
  "boto3>=1.42.53",
  "ray>=2.55.0",
  # Pin kernels <0.13: 0.15+ raises ValueError when LayerRepository/FuncRepository
  # are instantiated without `revision` or `version` (the transformers-integration
  # code path doesn't supply either). Reference:
  # https://github.com/huggingface/transformers/issues/46291
  # Track upstream transformer dep `kernels>=0.12.0,<0.13` (same range).
  "kernels>=0.12.0,<0.13",
  "sentry-sdk>=2.54.0",
  "pymongo>=4.10.1",
  "motor>=3.6.0",
  # Security: minimum versions enforced via constraint-dependencies (see below)
  "virtualenv>=21.2.0",
  "aiosqlite>=0.22.1",
  "pytest-asyncio>=1.3.0",
  "bedrock-agentcore-starter-toolkit>=0.3.6",
  "tinker>=0.18.2",
  "beautifulsoup4>=4.12.0",
  "ebooklib>=0.18",
  "pypdf>=6.15.0",
  "bitsandbytes>=0.49.2",
  "celery>=5.6.3",
  "anthropic>=0.107.1",
  "kaggle>=2.2.2",
  "pymupdf>=1.27.2.3",
  "psycopg2-binary>=2.9.12",
  "modal>=1.5.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "onnxruntime-gpu>=1.18.0",
    "pip-audit>=2.10.0",
    "hypothesis>=6.155.2",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = { where = ["."], include = ["*"] }

[tool.uv]
index-strategy = "first-index"
constraint-dependencies = [
    "gitpython>=3.1.55",
    "aiohttp>=3.13.5",
    "filelock>=3.20.3",
    "pillow>=12.1.1",
    "authlib>=1.6.11",
    "python-multipart>=0.0.30",
    "pytest>=9.0.3",
    "tornado>=6.5.5",
    "dynaconf>=3.2.13",
    "nbconvert>=7.17.0",
    "pyasn1>=0.6.3",
    "urllib3>=2.6.3",
    "werkzeug>=3.1.6",
    "trl>=0.11.0",
    "cbor2>=5.8.1",
    "langchain-core>=1.2.22",
    "diskcache>=6.0.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Route torch/torchvision/torchaudio through the PyTorch CPU index.
# Default PyPI pulls CUDA 12.x/13.x binaries that reference missing native
# libs on a CPU-only environment, breaking `import torchaudio`.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[tool.uv.workspace]
members = [
    "training/dataflow_eval",
]


[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [
  "node_modules",
  "stubs",
  "venv",
  ".venv",
  "env",
  "build",
  "dist",
  ".coveragerc",
  ".git",
  "dist",
  "**/__pycache__",
  "**/.*",
  "*.ipynb"
]
[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "N",
  "UP",
  "B",
  "A",
  "C4",
  "DTZ",
  "PIE",
  "PT",
  "Q",
  "RET",
  "SIM",
  "T20",
  "TID",
  "ARG",
  "PL",
  "RUF",
]
ignore = []
[tool.ruff.lint.per-file-ignores]
"scripts/verify_stage2_persona_quality.py" = ["E402", "PLC0415"]
"Stage1_Training_Notebook.ipynb" = ["E402", "PLC0415", "Q000", "I001", "T201"]
# Tests: bare numeric assertions are acceptable; broad ValueError catches are
# explicit pydantic/PydanticField validation tests
"tests/test_patient_psi_*.py" = ["PLR2004", "PT011"]
# FastAPI uses Depends() in argument defaults as its canonical DI pattern (B008)
# and auth-gating parameters are injected but appear "unused" in the body (ARG001)
"api/dataset_api.py" = ["B008", "ARG001"]
# Training pipeline CLI scripts use print() for user-facing output (T201)
"training/benchmark.py" = ["T201"]
"training/scripts/pixel_data_s3_processor.py" = ["T201"]
"training/ready_packages/scripts/pixel_data_s3_processor.py" = ["T201"]
"training/scripts/hetzner_52gb_processor.py" = ["T201"]
"training/ready_packages/scripts/hetzner_52gb_processor.py" = ["T201"]
"training/scripts/hetzner_direct_processor.py" = ["T201"]
"training/ready_packages/scripts/hetzner_direct_processor.py" = ["T201"]
"training/scripts/hetzner_s3_processor.py" = ["T201"]
"training/ready_packages/scripts/hetzner_s3_processor.py" = ["T201"]
"training/ready_packages/packages/apex/quick_start.py" = ["T201"]
# rclone_boto3_shim mirrors boto3's exact client API surface (Bucket/Key/Body/Prefix
# are capitalized by AWS convention, unused Range kwarg kept for API parity, etc.)
"scripts/rclone_boto3_shim.py" = ["N803", "ARG001", "ARG002", "PLR2004", "E701", "SIM210", "UP028", "PLC0415", "W293"]
# s3_streamer keeps optional chunk_bytes/chunk_size_mb kwargs for forward-compat API
"dataset_pipeline/extractors/s3_streamer.py" = ["ARG002"]
# GitHub repo adapter: complex multi-pattern JSON/CSV parser needs many branches;
# magic values are format-specific thresholds; psycopg2 import is lazy for optional dep
"sourcing/dataset_adapters/github_repo_adapter.py" = ["PLR2004", "PLR0912", "PLR0915", "PLR0913", "PLC0415"]
# Batch extraction script prints progress to stdout (T201)
"sourcing/scripts/extract_github_repos.py" = ["T201", "PLR2004", "PLR0912", "PLR0915", "SIM115"]
# Safety scan CLI script prints progress to stdout (T201)
"sourcing/scripts/run_safety_scan.py" = ["T201"]
# Kaggle therapy adapter: magic values for min message counts
"sourcing/dataset_adapters/kaggle_therapy_adapter.py" = ["PLR2004"]
# Kaggle extraction CLI: prints progress, sys.path setup before imports
"sourcing/scripts/extract_kaggle.py" = ["T201", "E402", "PLR2004"]
# Kaggle adapter tests: magic values for record counts
"sourcing/tests/test_kaggle_therapy_adapter.py" = ["PLR2004"]
# consolidate_v7: the dedup engine needs many return points for its decision tree
"dataset_pipeline/orchestration/consolidate_v7.py" = ["PLR0911"]
# V7 consolidation tests: magic values are dataset counts, long lines are test data
"dataset_pipeline/orchestration/test_consolidate_v7.py" = ["PLR2004", "E402", "PLR0913", "PLR0917"]
# MinHash/LSH tests: magic values in assertions, lazy imports to avoid circular deps
"dataset_pipeline/processors/test_minhash_lsh.py" = ["PLR2004", "PLC0415", "E402"]
# Integrity test module: many function args for check configuration, magic values for min message counts
"dataset_pipeline/processors/integrity_test.py" = ["PLR0913", "PLR0917", "PLR2004"]
# Integrity tests: magic values in assertions, sys.path setup before imports
"dataset_pipeline/processors/test_integrity.py" = ["PLR2004", "E402"]
# S3 sync tests: magic values in assertions, sys.path setup before imports
"dataset_pipeline/scripts/test_s3_atomic_sync.py" = ["PLR2004", "ARG001", "E402", "PT012"]
# S3 sync CLI: print statements for CLI output
"dataset_pipeline/scripts/s3_atomic_sync.py" = ["T201", "PLR2004"]
# Safety processor tests: magic values in assertions, lazy imports for optional deps
"sourcing/tests/test_safety_processors.py" = ["PLR2004", "PLC0415"]
# Adapter tests: magic values are dataset sizes/counts, long lines are test data
"sourcing/tests/test_github_repo_adapter.py" = ["PLR2004", "E501"]
"training_corpus/pal_framework/lint_dpo_dataset.py" = ["T201", "PLR0912"]
"training_corpus/pal_framework/generate_selection_dataset.py" = ["T201"]
"training_corpus/pal_framework/test_lint_dpo_dataset.py" = ["PLR2004", "PT018", "PLC0415"]
"training_corpus/pal_framework/test_generate_selection_dataset.py" = ["PLR2004", "PT018"]
[tool.ruff.lint.isort]
known-first-party = ["ai", "src"]
combine-as-imports = true
force-single-line = false
