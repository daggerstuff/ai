# Staging environment values
environment: "staging"

replicaCount: 2

image:
  tag: "staging-latest"

# Disable training in staging (no GPU nodes available)
training:
  enabled: false

app:
  config:
    logLevel: "INFO"
    debug: false
    maxWorkers: 3
    batchSize: 75

resources:
  limits:
    cpu: 1500m
    memory: 3Gi
  requests:
    cpu: 750m
    memory: 1.5Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5

postgresql:
  enabled: true
  image:
    repository: bitnami/postgresql
    tag: "latest"
    pullPolicy: Always
  primary:
    persistence:
      size: 50Gi
    resources:
      limits:
        cpu: 1500m
        memory: 3Gi
      requests:
        cpu: 750m
        memory: 1.5Gi

redis:
  enabled: true
  image:
    repository: bitnami/redis
    tag: "latest"
    pullPolicy: Always
  master:
    persistence:
      size: 10Gi
    resources:
      limits:
        cpu: 750m
        memory: 1.5Gi
      requests:
        cpu: 375m
        memory: 768Mi

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
  - host: pixelatedempathy.com
    paths:
    - path: /
      pathType: Prefix
  tls:
  - secretName: pixelated-empathy-tls
    hosts:
    - pixelatedempathy.com

backup:
  enabled: true
  schedule: "0 4 * * *"
  retention: "7d"
