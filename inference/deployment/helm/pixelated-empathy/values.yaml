# Default values for pixelated-empathy.
# This file is used by Trivy's Helm evaluator and as a fallback base.

# -- Pod-level security context (applied via spec.securityContext).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context (applied via spec.containers[].securityContext).
securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# -- Service account settings
serviceAccount:
  create: false
  name: ""

# -- Service settings
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# -- Application settings
app:
  config:
    logLevel: 'info'
    debug: false
    maxWorkers: 2
    batchSize: 50

  secrets:
    databaseUrl: ""
    redisUrl: ""
    jwtSecret: ""
    encryptionKey: ""
