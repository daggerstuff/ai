# Source dossier manifest — PIX-4589 / GitHub #5731
#
# Tracks the "knowledge and creator material" source family (SRC-013,
# SRC-086–SRC-099) for inspection, rights clearance, and citation lineage.
#
# Each entry records:
#   source_id        — canonical SRC-xxx identifier
#   title            — human-readable source name
#   ds_alias         — dataset alias (DS-xxx) if assigned
#   policy           — contribution policy code (K=knowledge, C=consent, V=verify)
#   scope            — one-line scope description
#   knowledge_tags   — training/retrieval domain tags
#   modality         — material type (book, transcript, mixed)
#   aliases          — derived copies, persona dirs, or sub-titles
#   locations        — where the source files live (L=local, G=gdrive, W=working)
#   inspection_status — pending | in_progress | complete
#   rights_decision  — pending | approved | denied | conditional
#   contribution_mode — pending | knowledge | sft | dpo | excluded
#   blocked_reproduction_rules — pending | rules string
#   product_links    — list of product/feature links using this source
#   linear_issue     — PIX-xxxx (cancelled child) if applicable
#   github_issue     — #xxxx (closed child) if applicable
#   p_list           — P-list mapping evidence
#
# All entries start as 'pending' since source files must be pulled from GDrive
# before inspection can proceed.

