    chapters:
    - 'M ost of us find ourselves too often repeating the same mistakes, stuck in bad habits, and few of us understand why. Procrastination, lack of assertion, disorganization, smoking, overworking, poor sleep habits, lack of consideration, depressed shopping, Internet addiction-all the way up through drug addiction and deliberate self-harm. Generally we know what we''re doing to ourselves, and we keep promising to reform. Indeed, we do try, often enough, but these habits are hard to break. Every time we try but fail, we become more hopeless and more critical of ourselves. Selfdestructive habits like these are the greatest source of unnecessary misery in our lives'
    - 'T he automatic self has learned many habits, below our awareness, that can incidentally lead to unintended negative consequences for us. I use the word incidentally because here, unlike in the chapters yet to come, there is no hidden motive, like anger or self-hate, at work. Much of this automatic behavior serves the purpose of keeping us comfortable, supporting our selfesteem, and not challenging our basic assumptions about life-but it can end up hurting us. This is the automatic self at work without conscious control. As we''ve said, the automatic self is usually very reliable. We''re constantly making decisions beneath the level of awareness, most of which work out well enough for us. But the automatic self can often be mistaken because of lack of knowledge, prejudice, bad logic, social influence, faulty assumptions, and a host of other factors. Those mistakes do not necessarily lead to self-destructive consequences, but when they do, and when it''s repeated, we have the kind of mistakes we can learn from, if only we pay attention. If there is any kind of self-blame that should be attached to this kind of behavior, it has to do with mental laziness and sloppy thinking. Homer Simpson, perhaps the most un-self-reflective character on television, caricatures this kind of life taken to the extreme. But also think of yourself and times when you''ve unintentionally embarrassed yourself or hurt others by assuming things not in evidence or leaping to unwarranted conclusions, or when you''ve made choices that you regretted that were influenced by hidden motives, like the desire to look good or fit in. The basic assumption here is I know what I''m doing, and results to the contrary are not my fault'
    - 'P owerful motivations and feelings-fear, anger, guilt, shame, envy, resentment-can operate outside our awareness and lead to selfdestructive choices. Many of us have become developmentally stuck around one or more of these emotions; when we feel them, we freeze up inside and don''t know what to do. These issues often are a dominant theme in our lives and our personalities, with their origins in childhood and our relationship with our parents. They influence who we are and how we act, but we''re not always conscious of their presence. There''s an old wound there, or a need unmet, and we keep trying to heal it throughout our lives. But these attempts at healing usually don''t work out-in fact often have selfdestructive consequences-because present reality is usually not enough to make up for past damage. The automatic self can''t repair itself, partly because it can''t really see where the trouble lies. The conscious self has trouble seeing it, because we have built up a whole network of defenses to keep the trouble out of awareness. And if we do see it, few of us have the knowledge we need to change the automatic self. That''s something I hope to help you find in this book'
    - 'A nger, like fear, is a useful emotion. It motivates us to protect ourselves and those we love. It''s behind our sense of justice and fair play. It''s another hardwired instinct we share with the higher mammals. But many of us have developed the idea that angry feelings are just not an acceptable part of the self. In the automatic self, repressed anger can seep through and affect our personality, or it can be expressed in disguised ways, like taking it out on the wrong target. In this chapter we''ll look at how the effort not to feel appropriate anger can get us into trouble. There''s not a conscious basic assumption here; it''s all in the automatic self: Watch out for me. I''ve got a grievance, and I''m going to make you suffer. If it''s anger at yourself, it''s more like bullying: Why can''t you get yourself together, you moron?'
    - 'I n this scenario, both the automatic self and the conscious self have developed the same delusion from life experience: the belief that you are special somehow, and the usual rules don''t apply. Of course most of us have some belief in our own uniqueness, but it gets us in trouble if taken too far. The paradigm can be solidI deserve to be treated better than other people -but fragile at the same time. So it usually takes a crisis of some kind for people like this to realize that something isn''t working. Some such people in crisis-for instance, when they are denied something important, like a promotion-will just strengthen their defenses and rationalize the disappointment away. Others, more vulnerable and more treatable, will collapse into depression as their false front is broken, and may begin to question their basic assumptions. In this chapter we''ll discuss how feeling special, better than others, entitled to better treatment, whether from plain old narcissism or other causes, leads to self-destructive behavior'
    - 'O ne of my guilty little pleasures is sometimes watching America''s Funniest Home Videos . Anyone who has seen this clip will remember it: A boy about two years old, dressed in his sleeper pajamas, is having a tantrum on the living room carpet. He''s on the floor, twisting and screaming and whining. Mom (with the camera) walks into another room. There''s silence. Then the boy''s head peers around the door, and when he knows Mom can see him, he throws himself down on the floor and resumes his tantrum. The sequence is repeated several times: Mom walks away, he quiets down, he finds her, he resumes his tantrum. Somehow he makes sure he''s always on the carpet, not the bare floor, to cushion his fall'
    - 'P ogo, Walt Kelly''s wise comic strip possum, said, "We have met the enemy, and he is us." The divided self may evolve in such a way that one part of us has feelings of hatred, disgust, shame, or rage at another. The basic assumption is something like I''m guilty; I''m at fault. If people knew the real me, they''d hate me. Self-hate may strike you as a rather intense term, but it''s very common. It''s a cancer of the soul, something that invades and pervades us before we''re aware of it, something that can make us sabotage and hurt ourselves. You may not ever have considered that a part of you hates yourself. But please remember that we''ve been talking about two minds, the automatic self and the conscious self, all along. Most people with this problem have only a dim conscious awareness of it. Self-hate, self-loathing, is very painful, and we try to forget or repress those feelings as soon as we can. But if you see patterns of self-destructive behavior in yourself, and don''t understand why, I urge you to reflect carefully on what''s to come. Some of the most handicapping and painful self-destructive behavior patterns are the result of self-hate at work. Take this short quiz and see if you find yourself here:'
    - 'W e referred in Chapter 1 to certain fundamental aspects of the automatic self that are not part of the assumptive world nor the Freudian unconscious, such as learning styles, thinking styles, feeling styles, how the body works unconsciously; the basic wiring of the brain, nervous system, and other body systems that are intricately linked; the immune system, the endocrine system; gastrointestinal, muscular, and other functions of the body that we tend to think of as automatic functions that are not affected by the mind and are therefore independent of our psychological history. But this is another area where neurology, psychology, and the health sciences have been making tremendous advancesespecially in the links between the physical organ of the brain and what we consider the mind-and showing us that these old assumptions are not so reliable anymore. Contrary to popular belief, the brain doesn''t tell us what to do; it is part of a system in which our life experience teaches our brain what to do. The brain can be suddenly and permanently rewired by traumatic events, as if struck by lightning, and it can be gradually misshapen and damaged through life experiences that eat away at our fundamental notions of safety, love, and justice. If people like this can be said to have a paradigm, it''s something like, I''m out of control and can''t trust myself anymore'
    - 'T here are people who sit on the sidelines of life watching the parade go by, never thinking that they could be part of it. Unlike the people in most of our other scenarios, they don''t experience much conflict between the automatic self and the conscious self. The automatic self has the paradigm that life is not worth taking chances, that the self as a whole is not very competent, and that happiness-or simply feeling better-is not worth the effort. These attitudes may not be fully conscious, but the conscious mind doesn''t challenge them. People in this situation may be fairly content with low expectations, working in jobs that require minimal skills, going home to sit on the couch and watch TV, never traveling far from home, their lives often enmeshed with extended family. In my little town in Connecticut, two hours by train or car from New York City, there are a surprising number of adults who have never been there and don''t see a reason to go. Other people in this situation may not be so content. They may live lives of quiet desperation, overwhelmed by worries, sadness, and loss. They don''t like their situation, but they don''t know where to start to change it. Both kinds are likely to drink or use drugs to get through life, and the young people are often in trouble for drugs and petty crime, until they settle down and fit in with the family''s pervasive assumptive world. Many of these people come from disadvantaged groups, and have been living in the "culture of poverty" (and discrimination) for generations. What''s selfdestructive for them is the absence of action and ambition, the passivity'
    - 'S ome people become self-destructive because life has burned them out. They''re overwhelmed by stress, have been disappointed too often, had high standards that were never met, and have given up trying. The paradigm is To hell with it. Life stinks and I''m not going to try anymore'
    - 'A ddictions are by their very nature self-destructive, because a drug or a habit has taken self-control away from you; you feel real distress without it. Addictions are of two types. One is the dependence on a foreign substance-drugs, alcohol, tobacco. The other type is behavioral addictions, in which there is no drug but an addiction to a certain pattern of behaviorsex, attraction to people who hurt you, eating disorders, gambling, overworking, being hooked on television or the Internet, depressed shopping, and more. These patterns of behavior can become so fixed in the brain that the person who tries to stop will experience genuine withdrawal -anxiety, sleeplessness, obsessional thinking, bargaining, etc., which follow the same pathways in the brain as substance abuse disorders'
    - 'B eing clinically depressed or anxious is almost normal in the U.S. today; the total incidence is approaching 50 percent, and the age of onset is younger and younger. The recognized symptoms of these conditions include much that is inherently self-destructive. There is a paradox here, because these are genuine and devastating illnesses-if you have one, you''re not to blame for it at all, and you must keep in mind that your illness is behind much of your self-destructive thinking and behavior. Yet it''s important to recognize that while a mental disorder may explain self-destructive traits, each separate self-destructive act is a reaction to events in the present world that represents a choice you have made. You''re not self-destructive 100 percent of the time; each specific act has its triggers and motivations, which suggests you have some control. You have to walk the thin line between taking responsibility for your recovery and falling into the trap of self-blame. So if, for example, you''re depressed and selfdestructive, it''s not enough to expect the pill or the therapist to stop you. You have to take yourself by the hand and examine your motives, defenses, and paradigms. You should not feel guilty or blame yourself if you have one of these problems, because they are beyond your personal control. They are well-integrated patterns in the automatic self. Besides, guilt and self-blame are symptoms of these conditions, and fuel your self-destruction. However, you are responsible for your own recovery, and here is where many of your bad habits can get you. You do have the responsibility to educate yourself about your condition and your self-destructive habits and do your best to control and eliminate them'
    - 'D espite growing acceptance, much of contemporary psychology and psychiatry would still like to forget about the unconscious. It''s an inconvenient concept. It''s hard to observe, measure, or test, so it seems not much use to science. "Just take this pill," they say, or "Just correct your thinking," or "Just learn to detach"-simple ideas that are researchable. But when we forget to take the pills, or when they make us turn purple, or when we slip back into negative thinking, or can''t seem to find the time to meditate-maybe that''s the unconscious at work. These are the patients who get dropped from the studies. They''re labeled as uncooperative. They don''t appear in medical journals, but they show up in my office, and the offices of thousands of other dynamic therapists across the country, saying they''ve tried everything and nothing works. What we do that nobody else does is acknowledge that there''s a force that gets in the way of total recovery, and try to work with it. That force is what I call the Undertowthe seemingly mysterious power that seems to wreck our attempts to escape self-destructive behavior just when we start to feel safe'
