# yaml-language-server: $schema=./bitbucket-pipelines.schema.json
image: python:3.13-bookworm # Python 3.13 with Debian Bookworm

clone:
  depth: full # SonarQube Cloud scanner needs full history

definitions:
  caches:
    sonar: ~/.sonar/cache
    uv: ~/.cache/uv
    pip: ~/.cache/pip
    huggingface: ~/.cache/huggingface
  services:
    docker:
      memory: 3072
  steps:
  - step: &install-dependencies
      name: Install Dependencies
      caches:
      - uv
      - pip
      script:
      # Install uv for fast Python dependency management
      - curl -LsSf https://astral.sh/uv/install.sh | sh
      - export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
      # Sync dependencies from pyproject.toml
      - uv sync --frozen
      # Verify installation
      - uv run python --version
      - uv run python -c "import torch; print(f'PyTorch {torch.__version__}')"
      artifacts:
      - .venv/**

  - step: &lint-and-format
      name: Lint and Format Check
      caches:
      - uv
      script:
      # Install uv for fast Python dependency management
      - curl -LsSf https://astral.sh/uv/install.sh | sh
      - export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
      # Run ruff linting
      - uv run ruff check . --output-format=github
      # Run black format check
      - uv run black --check .
      # Run nbqa for Jupyter notebooks
      - uv run nbqa ruff *.ipynb || true
      - uv run nbqa black --check *.ipynb || true

  - step: &type-check
      name: Type Check with MyPy
      caches:
      - uv
      script:
      # Install uv for fast Python dependency management
      - curl -LsSf https://astral.sh/uv/install.sh | sh
      - export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
      # Run mypy type checking
      - uv run mypy . --ignore-missing-imports --show-error-codes || true

  - step: &security-scan
      name: Security Vulnerability Scan
      caches:
      - uv
      - pip
      script:
      # Install uv for fast Python dependency management
      - curl -LsSf https://astral.sh/uv/install.sh | sh
      - export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
      # Install security scanning tools
      - uv pip install pip-audit safety bandit
      # Run pip-audit for dependency vulnerabilities
      - uv run pip-audit --desc || true
      # Run bandit for code security issues
      - uv run bandit -r . -f json -o bandit-report.json || true
      - uv run bandit -r . || true
      artifacts:
      - bandit-report.json

  - step: &unit-tests
      name: Unit Tests with Coverage
      caches:
      - uv
      script:
      # Install uv for fast Python dependency management
      - curl -LsSf https://astral.sh/uv/install.sh | sh
      - export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
      # Run pytest with coverage
      - uv run pytest tests/ -v --cov=. --cov-report=xml --cov-report=html --cov-report=term
      # Display coverage summary
      - uv run coverage report
      artifacts:
      - coverage.xml
      - htmlcov/**

  - step: &integration-tests
      name: Integration Tests
      caches:
      - uv
      script:
      # Install uv for fast Python dependency management
      - curl -LsSf https://astral.sh/uv/install.sh | sh
      - export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
      # Run integration tests if they exist
      - |
        if [ -d "tests/integration" ]; then
          uv run pytest tests/integration/ -v --maxfail=3
        else
          echo "No integration tests found, skipping..."
        fi

  - step: &data-validation
      name: Data Pipeline Validation
      caches:
      - uv
      - huggingface
      script:
      # Install uv for fast Python dependency management
      - curl -LsSf https://astral.sh/uv/install.sh | sh
      - export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
      # Test data loaders
      - |
        if [ -d "pipelines/data_processing/ingestion" ]; then
          cd pipelines/data_processing/ingestion/
          uv run python dual_persona_loader.py || echo "Dual persona loader test completed"
          cd ../..
        fi
  - step: &model-validation
      name: Model Architecture Validation
      caches:
      - uv
      script:
      # Install uv for fast Python dependency management
      - curl -LsSf https://astral.sh/uv/install.sh | sh
      - export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
      # Validate model configurations
      - |
        if [ -d "lightning" ]; then
          echo "Validating model configurations..."
          uv run python -c "import json; json.load(open('config/production_config.json'))" || echo "No production config found"
        fi
      # Test inference service imports
      - |
        if [ -f "lightning/inference_service.py" ]; then
          uv run python -c "import sys; sys.path.insert(0, 'lightning'); from inference_service import app" || echo "Inference service validation completed"
        fi

  - step: &build-docker-image
      name: Build Docker Image
      services:
      - docker
      caches:
      - docker
      script:
      # Build Docker image
      - docker build -t pixelated-ai:${BITBUCKET_COMMIT} .
      - docker tag pixelated-ai:${BITBUCKET_COMMIT} pixelated-ai:latest
      # Save image for deployment
      - docker save pixelated-ai:${BITBUCKET_COMMIT} | gzip > pixelated-ai-image.tar.gz
      artifacts:
      - pixelated-ai-image.tar.gz

  - step: &sonarcloud-scan
      name: SonarCloud Analysis
      caches:
      - sonar
      script:
      - pipe: sonarsource/sonarcloud-scan:4.0.0
        variables:
          SONAR_TOKEN: $SONAR_TOKEN
          EXTRA_ARGS: >
            -Dsonar.python.coverage.reportPaths=coverage.xml -Dsonar.python.version=3.13 -Dsonar.sources=. -Dsonar.exclusions=**/*.ipynb,**/__pycache__/**,**/tests/**,**/.venv/**,**/dist/**,**/build/**

  - step: &quality-gate
      name: SonarCloud Quality Gate
      script:
      - pipe: sonarsource/sonarcloud-quality-gate:0.1.6

  - step: &deploy-staging
      name: Deploy to Staging
      deployment: staging
      image: mcr.microsoft.com/azure-cli:2.63.0
      script:
      - |
        set -euo pipefail
        for required in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_AKS_CLUSTER_NAME AZURE_AKS_RESOURCE_GROUP ACR_NAME; do
          if [ -z "${!required:-}" ]; then
            echo "ERROR: Missing required Bitbucket deployment variable: ${required}"
            exit 1
          fi
        done
        az login --service-principal \
          --username "$AZURE_CLIENT_ID" \
          --password "$AZURE_CLIENT_SECRET" \
          --tenant "$AZURE_TENANT_ID"
        az account set --subscription "$AZURE_SUBSCRIPTION_ID"
        az aks get-credentials --resource-group "$AZURE_AKS_RESOURCE_GROUP" --name "$AZURE_AKS_CLUSTER_NAME" --overwrite-existing
        IMAGE="${ACR_NAME}.azurecr.io/pixelatedempathy:${BITBUCKET_COMMIT}"
        kubectl -n pixelated-staging set image deployment/pixelated app="$IMAGE"
        if ! kubectl -n pixelated-staging rollout status deployment/pixelated --timeout=600s; then
          echo "Rollout failed or timed out."
          kubectl -n pixelated-staging describe deployment pixelated || true
          kubectl -n pixelated-staging get deployment pixelated -o wide || true
          kubectl -n pixelated-staging get pods -l app=pixelated -o wide || true
          for pod in $(kubectl -n pixelated-staging get pods -l app=pixelated --no-headers -o custom-columns=":metadata.name"); do
            echo "=== Logs for ${pod} (previous) ==="
            kubectl -n pixelated-staging logs "${pod}" --previous --tail=120 || true
            echo "=== Logs for ${pod} (current) ==="
            kubectl -n pixelated-staging logs "${pod}" --tail=120 || true
          done
          exit 1
        fi
        echo "Staging AKS deployment completed"

  - step: &deploy-production
      name: Deploy to Production
      deployment: production
      trigger: manual
      image: mcr.microsoft.com/azure-cli:2.63.0
      script:
      - |
        set -euo pipefail
        for required in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_AKS_CLUSTER_NAME AZURE_AKS_RESOURCE_GROUP ACR_NAME; do
          if [ -z "${!required:-}" ]; then
            echo "ERROR: Missing required Bitbucket deployment variable: ${required}"
            exit 1
          fi
        done
        az login --service-principal \
          --username "$AZURE_CLIENT_ID" \
          --password "$AZURE_CLIENT_SECRET" \
          --tenant "$AZURE_TENANT_ID"
        az account set --subscription "$AZURE_SUBSCRIPTION_ID"
        az aks get-credentials --resource-group "$AZURE_AKS_RESOURCE_GROUP" --name "$AZURE_AKS_CLUSTER_NAME" --overwrite-existing
        IMAGE="${ACR_NAME}.azurecr.io/pixelatedempathy:${BITBUCKET_COMMIT}"
        kubectl -n pixelated-production set image deployment/pixelated app="$IMAGE"
        if ! kubectl -n pixelated-production rollout status deployment/pixelated --timeout=600s; then
          echo "Rollout failed or timed out."
          kubectl -n pixelated-production describe deployment pixelated || true
          kubectl -n pixelated-production get deployment pixelated -o wide || true
          kubectl -n pixelated-production get pods -l app=pixelated -o wide || true
          for pod in $(kubectl -n pixelated-production get pods -l app=pixelated --no-headers -o custom-columns=":metadata.name"); do
            echo "=== Logs for ${pod} (previous) ==="
            kubectl -n pixelated-production logs "${pod}" --previous --tail=120 || true
            echo "=== Logs for ${pod} (current) ==="
            kubectl -n pixelated-production logs "${pod}" --tail=120 || true
          done
          exit 1
        fi
        echo "Production AKS deployment completed"

  # Governance validation step for dataset expansion
  - step: &governance-validate
      name: Governance Matrix Validation
      caches:
      - uv
      script:
      - curl -LsSf https://astral.sh/uv/install.sh | sh
      - export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
      - |
        if [ -f "scripts/governance/validate_data_source_matrix.py" ]; then
          uv run python scripts/governance/validate_data_source_matrix.py
        elif [ -f "../scripts/governance/validate_data_source_matrix.py" ]; then
          uv run python ../scripts/governance/validate_data_source_matrix.py
        else
          echo "ERROR: Could not find validate_data_source_matrix.py"
          echo "Current directory: $(pwd)"
          echo "Looking for: scripts/governance/validate_data_source_matrix.py"
          find . -name "validate_data_source_matrix.py" 2>/dev/null || echo "Script not found in repository"
          exit 1
        fi

pipelines:
  default:
  - step: *install-dependencies
  - step: *governance-validate
  - parallel:
    - step: *lint-and-format
    - step: *type-check
    - step: *security-scan
  - step: *unit-tests
  - step: *integration-tests
  - parallel:
    - step: *data-validation
    - step: *model-validation
  - step: *sonarcloud-scan
  - step: *quality-gate

  branches:
    master:
    - step: *install-dependencies
    - step: *governance-validate
    - parallel:
      - step: *lint-and-format
      - step: *type-check
      - step: *security-scan
    - step: *unit-tests
    - step: *integration-tests
    - parallel:
      - step: *data-validation
      - step: *model-validation
    - step: *build-docker-image
    - step: *sonarcloud-scan
    - step: *quality-gate
    - step: *deploy-staging

    production:
    - step: *install-dependencies
    - parallel:
      - step: *lint-and-format
      - step: *type-check
      - step: *security-scan
    - step: *unit-tests
    - step: *integration-tests
    - step: *build-docker-image
    - step: *sonarcloud-scan
    - step: *quality-gate
    - step: *deploy-production

  pull-requests:
    '**':
    - step: *install-dependencies
    - step: *governance-validate
    - parallel:
      - step: *lint-and-format
      - step: *type-check
      - step: *security-scan
    - step: *unit-tests
    - step: *sonarcloud-scan
    - step: *quality-gate

  tags:
    'v*':
    - step: *install-dependencies
    - step: *unit-tests
    - step: *build-docker-image
    - step: *deploy-production

  custom:
    full-test-suite:
    - step: *install-dependencies
    - parallel:
      - step: *lint-and-format
      - step: *type-check
      - step: *security-scan
    - step: *unit-tests
    - step: *integration-tests
    - parallel:
      - step: *data-validation
      - step: *model-validation
    - step: *sonarcloud-scan
    - step: *quality-gate

    security-audit:
    - step: *install-dependencies
    - step: *security-scan

    quick-test:
    - step: *install-dependencies
    - step: *lint-and-format
    - step: *unit-tests
