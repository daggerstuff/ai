name: Training Safety Coverage

on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --project . --all-extras
          mkdir -p coverage

      - name: safety-critical-coverage
        run: |
          uv run pytest training/tests/test_shared_config.py training/tests/test_multilingual_safety_checker.py training/tests/test_clinical_safety_checker.py training/tests/test_reward_score.py \
            --cov=training.shared_config \
            --cov=training.multilingual_safety_checker \
            --cov=training.clinical_safety_checker \
            --cov=training.reward_score \
            --cov-branch --cov-fail-under=95 -q \
            --cov-report=xml:coverage/safety-critical-coverage.xml \
            --cov-report=term

      - name: pilot-module-coverage
        run: |
          uv run pytest training/tests --ignore=training/tests/test_book_pdf_converter.py \
            --cov=training.pixelated_production_pilot \
            --cov-branch --cov-fail-under=40 -q \
            --cov-report=xml:coverage/pilot-coverage.xml \
            --cov-report=term

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/*.xml
          retention-days: 15
