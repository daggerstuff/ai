name: CI

on:
  push:
    branches: [staging, main, develop]
  pull_request:
    branches: [staging, main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # The release builders resolve their evaluation fixtures through
      # ROOT = parents[2], i.e. the directory that contains this checkout, and
      # read them from ROOT/docs/training/execution-2026-10-17. Without that
      # sibling checkout evaluation_texts() returns an empty set, so the
      # "paraphrases never reuse evaluation text" guards assert on nothing.
      - name: Checkout docs fixtures
        run: |
          target="$(dirname "$GITHUB_WORKSPACE")/docs"
          if [ ! -d "$target/training" ]; then
            git clone --depth 1 --filter=blob:none --sparse \
              https://github.com/daggerstuff/docs.git "$target"
            git -C "$target" sparse-checkout set training/execution-2026-10-17
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Check out the shared eval corpus
        run: |
          git clone --depth 1 https://github.com/daggerstuff/docs.git "$(dirname "$GITHUB_WORKSPACE")/docs"

      - name: Run unit tests
        run: |
          uv run pytest training/tests/ qa/testing/ tests/training/ \
            --ignore=qa/testing/test_extraction_modules.py \
            --ignore=qa/testing/test_receipt_persistence.py \
            --ignore=qa/testing/test_receipts.py \
            --ignore=qa/testing/test_vertical_fidelity_stack.py \
            -v --cov=. --cov-report=lcov

      - name: Prepare coverage report
        run: |
          mkdir -p coverage
          mv coverage.lcov coverage/lcov.info
