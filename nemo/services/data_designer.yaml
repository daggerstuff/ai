# NVIDIA NeMo Data Designer Service Configuration
# This file defines the Data Designer microservice for synthetic dataset generation.

# Service definition for Docker Compose or Kubernetes deployment
service:
  name: data-designer
  image: nvcr.io/nvidia/nemo-microservices/data-designer:25.12
  tag: '25.12'
  port: 8000
  # Alternative: nvcr.io/nvidia/nemo-microservices/data-designer:latest

# Volume configuration for persistent data storage
volumes:
  data-designer-data:
    driver: local
    # Configure size as needed: driver: local, driver_opts: ["type=tmpfs", "device=/tmp/data"]
  data-designer-config:
    driver: local

# Build configuration (for custom builds or overrides)
build:
  # Docker context if building custom image
  # context: ./docker/data-designer
  # dockerfile: Dockerfile.data-designer

  # Environment variables for build
  # args:
  #   NVIDIA_API_KEY: ${NVIDIA_API_KEY}

# Network configuration
networks:
  - nmp-network
  - nmp

# Resource requirements (for Kubernetes)
resources:
  requests:
    memory: '2Gi'
    cpu: '1'
  limits:
    memory: '4Gi'
    cpu: '2'

# Health check configuration
healthcheck:
  path: /health
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

# Environment variables
environment:
  - NVIDIA_API_KEY
  - NEMO_MICROSERVICES_DATA_DESIGNER_JOB_IMAGE=${NEMO_MICROSERVICES_IMAGE_REGISTRY}/data-designer:${NEMO_MICROSERVICES_IMAGE_TAG}
  - DATA_DESIGNER_HOST: 0.0.0.0
  - DATA_DESIGNER_PORT: 8000
  - NEMO_MICROSERVICES_DATA_DESIGNER_MODEL_PROVIDER_REGISTRY: '{"providers":[{"name":"nim","endpoint":"https://integrate.api.nvidia.com/v1","provider_type":"openai","api_key":"NVIDIA_API_KEY"}],"default":"nim"}'

# Dependencies (services that must be running first)
depends_on:
  - datastore
  - nmp-core

# Persistent volume claims (for Kubernetes)
pvc:
  data:
    size: 10Gi
    access_modes:
      - ReadWriteOnce
  config:
    size: 1Gi
    access_modes:
      - ReadWriteOnce

# Ingress configuration (for Kubernetes production)
ingress:
  enabled: false
  host: nemo-data-designer.your-cluster-domain.com
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  tls:
    - secretName: nemo-data-designer-tls
      hosts:
        - nemo-data-designer.your-cluster-domain.com

# API configuration
api:
  title: NVIDIA NeMo Data Designer
  version: '25.12'
  description: Generate synthetic therapeutic and bias-detection datasets
  endpoint: /v1/data-designer

# Integration with Pixelated Empathy
integration:
  bias_detection:
    enabled: true
    dataset_path: /workspace/synthetic_data/bias_detection
  therapeutic_dataset:
    enabled: true
    dataset_path: /workspace/synthetic_data/therapeutic
  dataset_pipeline:
    enabled: true
    prompt_corpus_path: /workspace/prompt_corpus
    edge_cases_path: /workspace/edge_cases
    stage_exports_path: /workspace/stage_exports

# Development configuration
development:
  # Mount local directories for development
  mount_prompt_corpus: true
  mount_edge_cases: true
  mount_stage_exports: true
  # Source paths (relative to project root)
  prompt_corpus_source: ./ai/dataset_pipeline/prompt_corpus
  edge_cases_source: ./ai/pipelines/edge_case_pipeline_standalone/output
  stage_exports_source: ./ai/training_data_consolidated/final
