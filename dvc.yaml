# DVC pipeline definition for training data curation
# Run from the ai/ repo root (where .dvc/ lives):
#   dvc repro          # requires data/raw/deduped/all_desloped.jsonl (S3: whitebat)
stages:
  curate:
    cmd: python -m training.curate_pipeline --input data/raw/deduped/all_desloped.jsonl --output data/curated
    outs:
      - data/curated/sft_chatml/train.jsonl
      - data/curated/sft_chatml/val.jsonl
      - data/curated/sft_chatml/test.jsonl
