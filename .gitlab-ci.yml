---
# GitLab CI/CD Pipeline for Pixelated AI Module
# This configuration uses uv for Python package management

stages:
- validate
- test
- build
- deploy

variables:
  # Python and uv configuration
  PYTHON_VERSION: "3.13.13"
  UV_VERSION: "latest"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

  # Container configuration
  CONTAINER_IMAGE: $CI_REGISTRY_IMAGE/ai:$CI_COMMIT_SHA
  CONTAINER_IMAGE_LATEST: $CI_REGISTRY_IMAGE/ai:latest

cache:
  key:
    files:
    - pyproject.toml
    - uv.lock
    prefix: $CI_COMMIT_REF_SLUG
  paths:
  - .cache/pip
  - .venv/

# Install uv and Python dependencies
.uv_setup: &uv_setup
  image: python:3.13-slim
  before_script:
  - echo "📦 Installing uv package manager..."
  - apt-get update -y && apt-get install -y curl
  - curl -LsSf https://astral.sh/uv/install.sh | sh
  - export PATH="$HOME/.local/bin:$PATH"
  - uv --version
  - echo "📥 Installing project dependencies..."
  - uv sync --frozen
  - uv pip list

# Validate Python code syntax and configuration
validate:python:
  <<: *uv_setup
  stage: validate
  script:
  - echo "✅ Validating Python syntax and imports..."
  - uv run python -m py_compile $(find . -name "*.py" -not -path "./.venv/*" -not -path "./.*")
  - echo "✅ Checking pyproject.toml configuration..."
  - uv run python -c "import tomllib; f = open('pyproject.toml', 'rb'); tomllib.load(f); f.close()"
  only:
  - branches
  - merge_requests

# Run linting and formatting checks
lint:python:
  <<: *uv_setup
  stage: validate
  script:
  - echo "🔍 Running code quality checks..."
  - uv run ruff check . || true
  - uv run black --check . || true
  allow_failure: true
  only:
  - branches
  - merge_requests

# Run unit tests with pytest
test:unit:
  <<: *uv_setup
  stage: test
  script:
  - echo "🧪 Running unit tests..."
  - uv run pytest training/tests/ qa/testing/ -v --tb=short --color=yes
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
    - htmlcov/
    expire_in: 1 week
  only:
  - branches
  - merge_requests

# Type checking with mypy (optional, allow failure)
test:typecheck:
  <<: *uv_setup
  stage: test
  script:
  - echo "🔍 Running type checks..."
  - uv run mypy . --ignore-missing-imports || true
  allow_failure: true
  only:
  - branches
  - merge_requests

# Build Docker image for AI services
build:docker:
  stage: build
  image: docker:27-dind
  # Heavy job: only run on controlled events to preserve CI minutes
  services:
  - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ''
    DOCKER_HOST: tcp://docker:2375
  before_script:
  - echo "🔐 Logging in to GitLab Container Registry..."
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
  - echo "🏗️ Building Docker image for AI module..."
  - |
    if [ -f "Dockerfile" ]; then
      docker build -t $CONTAINER_IMAGE -t $CONTAINER_IMAGE_LATEST .
      docker push $CONTAINER_IMAGE
      docker push $CONTAINER_IMAGE_LATEST
      echo "✅ Docker images built and pushed successfully"
    else
      echo "⚠️ No Dockerfile found, skipping Docker build"
    fi
  only:
  - master
  - main
  - tags
  rules:
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_PIPELINE_SOURCE == "schedule"'
  - if: '$CI_COMMIT_TAG'
  - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  - when: never

# Note: Deployment is managed by the Azure Kubernetes deployment pipeline.
# This GitLab pipeline handles validation, tests, and image build/publish only.
# The following stages are preserved for reference or fallback.

# Deploy to production (manual trigger only)
deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
  - apk add --no-cache curl
  script: |
    echo "🚀 Deploying AI module to production environment..."
    echo "Container image: $CONTAINER_IMAGE"
    echo "⚠️ Deployment logic not implemented yet"

  environment:
    name: 'production'
    url: 'https://pixelatedempathy.com'
  only:
  - tags
  when: manual
